---
- name: torrent-guard | Fail if distro is not supported
  ansible.builtin.fail:
    msg: "Distribution '{{ ansible_facts['distribution'] }}' is not supported. Supported: Debian, Ubuntu"
  when: ansible_facts['distribution'] not in ['Debian', 'Ubuntu']

- name: torrent-guard | Validate variables
  ansible.builtin.assert:
    that:
      - torrent_guard_mode in ['monitor', 'block']
      - torrent_guard_wg_cli in ['awg', 'wg']
      - torrent_guard_push_url | length == 0 or torrent_guard_push_token | length > 0
      - torrent_guard_push_url | length == 0 or torrent_guard_push_url is match('https://')
    fail_msg: "torrent_guard_mode: monitor|block, wg_cli: awg|wg; push_url needs https:// and push_token"
    quiet: true

- name: torrent-guard | Install conntrack, ipset and iptables
  ansible.builtin.apt:
    name:
      - conntrack
      - ipset
      - iptables
    state: present
    cache_valid_time: 3600

## connbytes (scan only the first packets of a flow) silently never matches
## without per-flow accounting. Applies to flows created after the change.
- name: torrent-guard | Enable conntrack accounting
  ansible.posix.sysctl:
    name: net.netfilter.nf_conntrack_acct
    value: "1"
    sysctl_file: "{{ torrent_guard_sysctl_file }}"
    state: present
    reload: true

- name: torrent-guard | Create state directory
  ansible.builtin.file:
    path: "{{ torrent_guard_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: torrent-guard | Create log directory
  ansible.builtin.file:
    path: "{{ torrent_guard_log_dir }}"
    state: directory
    owner: root
    group: adm
    mode: "0750"
  when: torrent_guard_log_dir | length > 0

- name: torrent-guard | Deploy logrotate config
  ansible.builtin.template:
    src: torrent-guard.logrotate.j2
    dest: /etc/logrotate.d/torrent-guard
    owner: root
    group: root
    mode: "0644"
  when: torrent_guard_log_dir | length > 0

- name: torrent-guard | Deploy script
  ansible.builtin.copy:
    src: torrent-guard.py
    dest: "{{ torrent_guard_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: Apply torrent-guard rules

- name: torrent-guard | Deploy environment file
  ansible.builtin.template:
    src: torrent-guard.env.j2
    dest: "{{ torrent_guard_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Apply torrent-guard rules

- name: torrent-guard | Deploy systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - torrent-guard@.service
    - torrent-guard-collect.timer
    - torrent-guard-push.timer
  notify: Reload systemd

- name: torrent-guard | Flush handlers
  ansible.builtin.meta: flush_handlers

- name: torrent-guard | Enable collect timer
  ansible.builtin.systemd:
    name: torrent-guard-collect.timer
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"  # unit absent on first --check

- name: torrent-guard | Enable push timer
  ansible.builtin.systemd:
    name: torrent-guard-push.timer
    enabled: "{{ torrent_guard_push_url | length > 0 }}"
    state: "{{ 'started' if torrent_guard_push_url | length > 0 else 'stopped' }}"
  ignore_errors: "{{ ansible_check_mode }}"
